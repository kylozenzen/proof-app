<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Proof — Content Approval Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF8F4;--cream-dark:#F0EDE6;--cream-border:#E4DDD3;
  --charcoal:#1C1A18;--charcoal-mid:#3A3733;--charcoal-soft:#6B6560;
  --amber:#E8A020;--amber-light:#FFF0D0;--amber-dark:#C07010;
  --green:#2D7A4F;--green-light:#D6F0E2;
  --red:#C0392B;--red-light:#FDECEA;
  --blue:#2563EB;--blue-light:#EFF6FF;
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal)}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:258px;min-width:258px;background:var(--charcoal);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo-wrap{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-tagline{font-size:10px;color:rgba(255,255,255,.28);margin-top:5px;letter-spacing:.5px;text-transform:uppercase}
.sidebar-section{padding:18px 14px 8px}
.sidebar-section-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);padding:0 8px;margin-bottom:6px}
.board-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:2px;font-size:13.5px;color:rgba(255,255,255,.6);border:1px solid transparent}
.board-item:hover{background:rgba(255,255,255,.07);color:#fff}
.board-item.active{background:rgba(232,160,32,.13);color:#fff;border-color:rgba(232,160,32,.26)}
.board-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.badge{margin-left:auto;background:var(--amber);color:var(--charcoal);font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px}
.sidebar-new-btn{margin:10px 14px 0;padding:9px;border-radius:8px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.13);color:rgba(255,255,255,.38);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.sidebar-new-btn:hover{background:rgba(255,255,255,.09);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.22)}
.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.07);padding:14px}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s}
.user-pill:hover{background:rgba(255,255,255,.07)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--charcoal);flex-shrink:0}
.u-name{font-size:13px;font-weight:500;color:#fff}
.u-role{font-size:11px;color:rgba(255,255,255,.36)}

/* LOGO */
.proof-logo{display:inline-flex;align-items:baseline;gap:1px;line-height:1}
.proof-logo-text{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;letter-spacing:-1.5px;background:linear-gradient(135deg,#fff 20%,#E8A020 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.proof-logo-text.dark{background:linear-gradient(135deg,#1C1A18 20%,#C07010 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.proof-logo-dot{font-family:'Playfair Display',serif;font-weight:700;font-style:normal;color:var(--amber);-webkit-text-fill-color:var(--amber)}
.proof-logo-tag{font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-left:5px;align-self:center;font-style:normal;font-family:'DM Sans',sans-serif}
.proof-logo-tag.dark{color:var(--charcoal-soft)}

/* MAIN */
.main{flex:1;overflow-y:auto}
.topbar{padding:18px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--cream-border);background:var(--cream);position:sticky;top:0;z-index:10}
.topbar-left h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;letter-spacing:-.3px}
.topbar-left p{font-size:12.5px;color:var(--charcoal-soft);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--charcoal);color:#fff}.btn-primary:hover{background:var(--charcoal-mid)}
.btn-amber{background:var(--amber);color:var(--charcoal);font-weight:600}.btn-amber:hover{background:var(--amber-dark);color:#fff}
.btn-ghost{background:transparent;color:var(--charcoal-soft);border:1px solid var(--cream-border)}.btn-ghost:hover{background:var(--cream-dark);color:var(--charcoal)}
.btn-green{background:var(--green);color:#fff;font-weight:600}.btn-green:hover{background:#236340}
.btn-red-soft{background:var(--red-light);color:var(--red);font-weight:600;border:1px solid rgba(192,57,43,.18)}.btn-red-soft:hover{background:#fad}
.btn-sm{padding:5px 11px;font-size:12px}

/* STATS */
.stats-bar{display:flex;gap:1px;background:var(--cream-border);border-bottom:1px solid var(--cream-border)}
.stat-box{flex:1;padding:16px 22px;background:var(--cream);display:flex;flex-direction:column;gap:3px}
.stat-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;line-height:1}
.stat-label{font-size:12px;color:var(--charcoal-soft);font-weight:500}
.stat-box.amber .stat-num{color:var(--amber-dark)}
.stat-box.green .stat-num{color:var(--green)}

/* POST CARDS */
.content{padding:24px 32px}
.posts-grid{display:flex;flex-direction:column;gap:10px}
.post-card{background:#fff;border:1px solid var(--cream-border);border-radius:12px;overflow:hidden;transition:all .2s;cursor:pointer;display:flex;align-items:stretch}
.post-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07);border-color:#CCC8C0;transform:translateY(-1px)}
.post-card-accent{width:4px;flex-shrink:0}
.post-card-accent.pending{background:var(--amber)}
.post-card-accent.needs-edits{background:var(--red)}
.post-card-accent.approved{background:var(--green)}
.post-card-accent.draft{background:var(--cream-border)}
.post-card-accent.in-review{background:var(--blue)}
.post-card-body{flex:1;padding:14px 18px;display:flex;align-items:center;gap:14px}
.post-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--cream-dark)}
.post-thumb-icon{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--cream-dark)}
.post-info{flex:1;min-width:0}
.post-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-meta{font-size:12px;color:var(--charcoal-soft);margin-top:2px}
.post-preview{font-size:12px;color:var(--charcoal-soft);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px}
.post-card-actions{display:flex;align-items:center;gap:8px;padding-right:14px}
.status-pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;flex-shrink:0}
.status-pill.pending{background:var(--amber-light);color:var(--amber-dark)}
.status-pill.needs-edits{background:var(--red-light);color:var(--red)}
.status-pill.approved{background:var(--green-light);color:var(--green)}
.status-pill.draft{background:var(--cream-dark);color:var(--charcoal-soft)}
.status-pill.in-review{background:var(--blue-light);color:var(--blue)}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,15,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.modal{background:var(--cream);border-radius:16px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal-header{padding:22px 26px 18px;border-bottom:1px solid var(--cream-border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal-header h3{font-family:'Playfair Display',serif;font-size:19px;font-weight:600}
.modal-header p{font-size:12.5px;color:var(--charcoal-soft);margin-top:4px}
.modal-close{width:30px;height:30px;border-radius:7px;background:var(--cream-dark);border:none;cursor:pointer;font-size:14px;color:var(--charcoal-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.modal-close:hover{background:var(--cream-border);color:var(--charcoal)}
.modal-body{padding:22px 26px}
.modal-footer{padding:14px 26px;border-top:1px solid var(--cream-border);display:flex;gap:10px;justify-content:flex-end}

/* POST CONTENT BOX */
.post-content-box{background:#fff;border:1px solid var(--cream-border);border-radius:10px;padding:16px;margin-bottom:18px}
.post-content-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--charcoal-soft);margin-bottom:10px}
.post-modal-image{width:100%;height:200px;object-fit:cover;border-radius:8px;margin-bottom:12px;display:block}
.post-hashtags{margin-top:10px}
.hashtag{display:inline-block;font-size:12px;color:var(--blue);margin-right:6px;font-weight:500}

/* LINK BOX */
.link-box-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--charcoal-soft);margin-bottom:6px}
.link-box{background:var(--cream-dark);border:1px solid var(--cream-border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.link-box-url{font-size:12px;color:var(--charcoal-soft);flex:1;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* THREAD */
.thread{display:flex;flex-direction:column;gap:12px}
.thread-msg{display:flex;gap:10px}
.thread-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.thread-bubble{flex:1;background:#fff;border:1px solid var(--cream-border);border-radius:0 10px 10px 10px;padding:11px 13px}
.thread-bubble.client{background:var(--amber-light);border-color:rgba(232,160,32,.2);border-radius:10px 10px 10px 0}
.thread-meta{font-size:11px;color:var(--charcoal-soft);margin-bottom:3px;font-weight:500}
.thread-text{font-size:13px;line-height:1.5}
.thread-input{display:flex;gap:10px;margin-top:14px;align-items:flex-end}
.thread-textarea{flex:1;padding:9px 13px;border:1px solid var(--cream-border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;resize:none;background:#fff;color:var(--charcoal);outline:none;transition:border-color .15s}
.thread-textarea:focus{border-color:var(--charcoal)}

/* FORM */
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;color:var(--charcoal);display:block;margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 13px;border:1px solid var(--cream-border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--charcoal);outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--charcoal)}
.form-textarea{resize:vertical;min-height:88px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* EMPTY */
.empty-state{padding:60px 20px;text-align:center;color:var(--charcoal-soft)}
.empty-icon{font-size:38px;margin-bottom:12px}
.empty-state h3{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:5px;color:var(--charcoal)}

/* CLIENT VIEW */
.cv-wrap{min-height:100vh;background:#FAF8F4;font-family:'DM Sans',sans-serif;color:#1C1A18}
.cv-topbar{padding:14px 28px;border-bottom:1px solid #E4DDD3;display:flex;align-items:center;justify-content:space-between;background:#FAF8F4;position:sticky;top:0;z-index:10}
.cv-back{background:none;border:1px solid #E4DDD3;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;color:#6B6560;font-family:'DM Sans',sans-serif;transition:all .15s}
.cv-back:hover{background:#F0EDE6;color:#1C1A18}
.cv-no-login{font-size:12px;color:#6B6560}
.cv-body{max-width:560px;margin:0 auto;padding:44px 20px}
.cv-greeting{margin-bottom:28px}
.cv-greeting h2{font-family:'Playfair Display',serif;font-size:25px;font-weight:600}
.cv-greeting p{font-size:14px;color:#6B6560;margin-top:6px;line-height:1.6}
.cv-card{background:#fff;border:1px solid #E4DDD3;border-radius:14px;overflow:hidden;margin-bottom:22px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.cv-card-header{padding:14px 18px;border-bottom:1px solid #E4DDD3;display:flex;align-items:center;gap:10px;background:#FEFCF9}
.cv-card-icon{font-size:20px}
.cv-card-title{font-size:14px;font-weight:600}
.cv-card-sub{font-size:12px;color:#6B6560}
.cv-card-body{padding:20px}
.cv-post-image{width:100%;height:220px;object-fit:cover;border-radius:8px;margin-bottom:14px;display:block}
.cv-copy{font-size:14px;line-height:1.8;color:#1C1A18}
.cv-tags{margin-top:12px}
.cv-tag{display:inline-block;font-size:12px;color:#2563EB;margin-right:6px;font-weight:500}
.cv-actions{display:flex;gap:10px}
.cv-btn{padding:12px 20px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1}
.cv-btn-approve{background:#2D7A4F;color:#fff}.cv-btn-approve:hover{background:#236340}
.cv-btn-edit{background:#FDECEA;color:#C0392B;border:1px solid rgba(192,57,43,.18)}.cv-btn-edit:hover{background:#fad}
.cv-edit-panel{background:#F0EDE6;border:1px solid #E4DDD3;border-radius:10px;padding:16px;margin-top:14px}
.cv-edit-label{font-size:12px;font-weight:600;color:#1C1A18;display:block;margin-bottom:8px}
.cv-edit-textarea{width:100%;padding:10px 12px;border:1px solid #E4DDD3;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;resize:vertical;background:#fff;color:#1C1A18;outline:none;min-height:90px;transition:border-color .15s}
.cv-edit-textarea:focus{border-color:#1C1A18}
.cv-submit-btn{margin-top:10px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:#1C1A18;color:#fff;font-family:'DM Sans',sans-serif;transition:all .15s}
.cv-submit-btn:hover{background:#3A3733}
.cv-powered{text-align:center;margin-top:50px;font-size:12px;color:#bbb}
.cv-powered b{color:#6B6560;font-weight:500}
.cv-success-body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center}
.cv-success-icon{font-size:64px;margin-bottom:20px;animation:popIn .4s ease}
.cv-success-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:10px}
.cv-success-sub{font-size:14px;color:#6B6560;max-width:300px;line-height:1.6}

/* NEW BOARD MODAL */
.nb-modal{background:var(--cream);border-radius:16px;width:100%;max-width:480px;animation:slideUp .25s ease;box-shadow:0 30px 60px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const PLATFORMS = { instagram:'📸', twitter:'🐦', linkedin:'💼', tiktok:'🎵', facebook:'👥' };

const INITIAL_BOARDS = [
  { id:'self',  name:'My Personal Brand', color:'#E8A020', initials:'ME' },
  { id:'raven', name:'Raven Collective',  color:'#6C5CE7', initials:'RC' },
  { id:'verde', name:'Verde Kitchen',     color:'#2D7A4F', initials:'VK' },
  { id:'nova',  name:'Nova Fitness',      color:'#E84393', initials:'NF' },
];

// Reliable Unsplash source images
const SAMPLE_POSTS = [
  {
    id:1, boardId:'raven', title:'Spring Product Launch', platform:'instagram',
    image:'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=700&auto=format&fit=crop&q=80',
    content:"The wait is finally over 🌸 Our Spring 2025 collection drops tomorrow — six new pieces designed for the woman who makes her own rules. Early access link in bio.",
    hashtags:['#SpringCollection','#RavenCollective','#NewDrop','#WomenInFashion'],
    status:'needs-edits', dueDate:'Feb 19',
    thread:[
      {id:1,from:'you',text:'Copy is ready for review — let me know what you think!',time:'Feb 16, 2:30pm'},
      {id:2,from:'client',clientName:'Sarah M.',text:"Love the energy! Can you swap 'six new pieces' for 'twelve new styles'? Also, could we lead with the discount code instead of the reveal?",time:'Feb 17, 9:12am'},
    ]
  },
  {
    id:2, boardId:'verde', title:'Weekend Brunch Promo', platform:'instagram',
    image:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=700&auto=format&fit=crop&q=80',
    content:"Sundays were made for this. 🍳 Join us this weekend for our brand-new bottomless brunch. Fresh-pressed juices, our chef's signature eggs Benedict, and the best people-watching patio in town. Reserve your table — link in bio.",

    status:'pending', dueDate:'Feb 20',
    thread:[{id:1,from:'you',text:"Here's the draft for the brunch promo. Sent the review link to Marco!",time:'Feb 17, 10:00am'}]
  },
  {
    id:3, boardId:'nova', title:'New Class Schedule Drop', platform:'instagram',
    image:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=700&auto=format&fit=crop&q=80',
    content:"Your February just got stronger 💥 New classes added: 6AM Power HIIT (M/W/F), Saturday Yoga Flow, and our brand-new Recovery Lab on Sundays. Spots go fast. Book now in the Nova app.",

    status:'approved', dueDate:'Feb 18',
    thread:[
      {id:1,from:'you',text:'Draft ready for your review!',time:'Feb 15, 3:00pm'},
      {id:2,from:'client',clientName:'Jordan K.',text:'This is perfect. Approved!',time:'Feb 16, 11:00am'},
    ]
  },
  {
    id:4, boardId:'self', title:'Freelance Portfolio Post', platform:'linkedin',
    image:null,
    content:"Three years ago I had 0 followers and no strategy. Last month, the accounts I manage crossed 6 million total followers. Here's the framework I wish I had at the start 🧵",
    hashtags:['#ContentStrategy','#SocialMedia','#CreatorEconomy','#Freelance'],
    status:'draft', dueDate:'Feb 22',
    thread:[]
  },
  {
    id:5, boardId:'raven', title:'Community Spotlight Reel', platform:'instagram',
    image:'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=700&auto=format&fit=crop&q=80',
    content:"She's been wearing Raven for two years and still gets asked about every. single. outfit. Meet Emma — our community highlight this week ✨ Swipe to see her top picks from the archive.",
    hashtags:['#RavenFamily','#CommunitySpotlight','#OOTD'],
    status:'in-review', dueDate:'Feb 21',
    thread:[{id:1,from:'you',text:'Sent the review link to Sarah! Waiting on her response.',time:'Feb 17, 1:00pm'}]
  },
];

const STATUS_LABELS = { pending:'Awaiting Review','needs-edits':'Needs Edits',approved:'Approved ✓',draft:'Draft','in-review':'In Review' };
const STATUS_ORDER  = { 'needs-edits':0,pending:1,'in-review':2,draft:3,approved:4 };

// ── Shared helpers ──────────────────────────────────────────────────────────
function StatusPill({status}) {
  return <span className={`status-pill ${status}`}>{STATUS_LABELS[status]||status}</span>;
}

function BoardAvatar({board}) {
  return <div className="board-avatar" style={{background:board.color+'26',color:board.color}}>{board.initials}</div>;
}

function ProofLogo({size=24,dark=false}) {
  return (
    <div className="proof-logo">
      <span className={`proof-logo-text${dark?' dark':''}`} style={{fontSize:size}}><i>Proof</i></span>
      <span className="proof-logo-dot" style={{fontSize:size}}>.</span>
      <span className={`proof-logo-tag${dark?' dark':''}`}>Beta</span>
    </div>
  );
}

// ── Client Review ───────────────────────────────────────────────────────────
function ClientReview({post, board, onClose}) {
  const [mode,setMode]         = useState('view');
  const [editNote,setEditNote] = useState('');
  const [submitted,setSubmitted] = useState(null);

  const TopBar = () => (
    <div className="cv-topbar">
      <ProofLogo size={22} dark/>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <span className="cv-no-login">No account needed · Secure link</span>
        <button className="cv-back" onClick={onClose}>← Back to Dashboard</button>
      </div>
    </div>
  );

  if (submitted === 'approved') return (
    <div className="cv-wrap">
      <TopBar/>
      <div className="cv-success-body">
        <div className="cv-success-icon">✅</div>
        <div className="cv-success-title">All approved!</div>
        <div className="cv-success-sub">Your approval has been submitted. The creator will be notified right away.</div>
      </div>
    </div>
  );

  if (submitted === 'edits') return (
    <div className="cv-wrap">
      <TopBar/>
      <div className="cv-success-body">
        <div className="cv-success-icon">✏️</div>
        <div className="cv-success-title">Edits submitted!</div>
        <div className="cv-success-sub">Your notes have been sent to the creator. Expect a revised draft soon.</div>
      </div>
    </div>
  );

  return (
    <div className="cv-wrap">
      <TopBar/>
      <div className="cv-body">
        <div className="cv-greeting">
          <h2>You've got a post to review 👋</h2>
          <p><strong style={{color:'#1C1A18'}}>Your creator</strong> has shared content for your approval. Take a look and let them know if it's good to go — or leave notes for edits.</p>
        </div>

        <div className="cv-card">
          <div className="cv-card-header">
            <span className="cv-card-icon">{PLATFORMS[post.platform]}</span>
            <div>
              <div className="cv-card-title">{post.title}</div>
              <div className="cv-card-sub">For {board.name} · {post.platform}</div>
            </div>
          </div>
          <div className="cv-card-body">
            {post.image && (
              <img
                src={post.image}
                alt="Post visual"
                className="cv-post-image"
                onError={e=>{e.target.style.display='none'}}
              />
            )}
            <div className="cv-copy">{post.content}</div>
            <div className="cv-tags">{post.hashtags.map(h=><span key={h} className="cv-tag">{h}</span>)}</div>
          </div>
        </div>

        <div className="cv-actions">
          <button className="cv-btn cv-btn-approve" onClick={()=>setSubmitted('approved')}>✓ Approve This Post</button>
          <button className="cv-btn cv-btn-edit" onClick={()=>setMode(mode==='edit'?'view':'edit')}>✏️ Request Edits</button>
        </div>

        {mode==='edit' && (
          <div className="cv-edit-panel">
            <label className="cv-edit-label">Leave your notes for the creator</label>
            <textarea
              className="cv-edit-textarea"
              placeholder="e.g. Can you change the opening line? Also swap the hashtags for something more niche..."
              value={editNote}
              onChange={e=>setEditNote(e.target.value)}
            />
            <button className="cv-submit-btn" onClick={()=>editNote.trim()&&setSubmitted('edits')}>Submit Notes →</button>
          </div>
        )}

        <div className="cv-powered">Powered by <b>Proof</b> · Built for creators.</div>
      </div>
    </div>
  );
}

// ── Post Detail Modal ───────────────────────────────────────────────────────
function PostModal({post, board, onClose, onClientReview}) {
  const [thread,setThread] = useState(post.thread);
  const [newMsg,setNewMsg] = useState('');

  const send = () => {
    if (!newMsg.trim()) return;
    setThread(t=>[...t,{id:Date.now(),from:'you',text:newMsg,time:'Just now'}]);
    setNewMsg('');
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
              <span style={{fontSize:18}}>{PLATFORMS[post.platform]}</span>
              <StatusPill status={post.status}/>
            </div>
            <h3>{post.title}</h3>
            <p>For <strong style={{color:board.color}}>{board.name}</strong> · Due {post.dueDate}</p>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="post-content-box">
            <div className="post-content-label">Post Copy</div>
            {post.image && (
              <img
                src={post.image}
                alt=""
                className="post-modal-image"
                onError={e=>{e.target.style.display='none'}}
              />
            )}
            <div style={{fontSize:14,lineHeight:1.7}}>{post.content}</div>
            <div className="post-hashtags">{post.hashtags.map(h=><span key={h} className="hashtag">{h}</span>)}</div>
          </div>

          <div className="link-box-label">Client Review Link</div>
          <div className="link-box">
            <span className="link-box-url">proof.app/review/{post.id}-{post.title.toLowerCase().replace(/\s+/g,'-')}</span>
            <button className="btn btn-ghost btn-sm" onClick={onClientReview}>Preview →</button>
            <button className="btn btn-amber btn-sm" onClick={()=>{
              navigator.clipboard?.writeText(`proof.app/review/${post.id}`).catch(()=>{});
            }}>Copy Link</button>
          </div>

          <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:600,marginBottom:12}}>Feedback Thread</div>
          {thread.length===0 && (
            <div style={{textAlign:'center',padding:'14px 0',color:'var(--charcoal-soft)',fontSize:13}}>
              No feedback yet. Share the review link to get started.
            </div>
          )}
          <div className="thread">
            {thread.map(msg=>(
              <div key={msg.id} className="thread-msg">
                <div className="thread-avatar" style={{background:msg.from==='you'?'var(--charcoal)':board.color,color:'#fff'}}>
                  {msg.from==='you'?'B':(msg.clientName?.[0]||'C')}
                </div>
                <div className={`thread-bubble${msg.from==='client'?' client':''}`}>
                  <div className="thread-meta">{msg.from==='you'?'You':msg.clientName||'Client'} · {msg.time}</div>
                  <div className="thread-text">{msg.text}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="thread-input">
            <textarea
              className="thread-textarea"
              rows={2}
              placeholder="Reply to this thread…"
              value={newMsg}
              onChange={e=>setNewMsg(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),send())}
            />
            <button className="btn btn-primary btn-sm" onClick={send}>Send</button>
          </div>
        </div>
        <div className="modal-footer">
          {post.status==='needs-edits'  && <button className="btn btn-amber">Mark as Revised →</button>}
          {post.status==='in-review'    && <button className="btn btn-ghost">Resend Link</button>}
          {post.status==='approved'     && <button className="btn btn-primary">Schedule Post ↗</button>}
          {post.status==='draft'        && <button className="btn btn-amber">Send for Review →</button>}
          {post.status==='pending'      && <button className="btn btn-ghost btn-sm" onClick={onClientReview}>Preview Client View →</button>}
        </div>
      </div>
    </div>
  );
}

// ── New Post Modal ──────────────────────────────────────────────────────────
function NewPostModal({boards, onClose, onAdd}) {
  const [form,setForm] = useState({title:'',boardId:boards[0].id,platform:'instagram',content:'',hashtags:'',dueDate:''});
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const handleCreate = () => {
    if (!form.title.trim() || !form.content.trim()) return;
    onAdd({
      id: Date.now(),
      boardId: form.boardId,
      title: form.title,
      platform: form.platform,
      content: form.content,
      image: null,
      hashtags: form.hashtags.split(' ').filter(Boolean),
      status: 'draft',
      dueDate: form.dueDate || 'TBD',
      thread: []
    });
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div><h3>New Post</h3><p>Add a post to a client board for review</p></div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-group">
            <label className="form-label">Post Title</label>
            <input className="form-input" placeholder="e.g. Summer Campaign Kickoff" value={form.title} onChange={e=>set('title',e.target.value)}/>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Client Board</label>
              <select className="form-select" value={form.boardId} onChange={e=>set('boardId',e.target.value)}>
                {boards.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Platform</label>
              <select className="form-select" value={form.platform} onChange={e=>set('platform',e.target.value)}>
                {Object.entries(PLATFORMS).map(([p,icon])=><option key={p} value={p}>{icon} {p[0].toUpperCase()+p.slice(1)}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Post Copy</label>
            <textarea className="form-textarea" rows={4} placeholder="Write your post content here…" value={form.content} onChange={e=>set('content',e.target.value)}/>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Hashtags (space-separated)</label>
              <input className="form-input" placeholder="#hashtag1 #hashtag2" value={form.hashtags} onChange={e=>set('hashtags',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">Due Date</label>
              <input className="form-input" type="date" value={form.dueDate} onChange={e=>set('dueDate',e.target.value)}/>
            </div>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-amber" onClick={handleCreate}>Create Post →</button>
        </div>
      </div>
    </div>
  );
}

// ── New Board Modal ─────────────────────────────────────────────────────────
function NewBoardModal({onClose, onAdd}) {
  const [name,setName]   = useState('');
  const [color,setColor] = useState('#2563EB');

  const COLORS = ['#E8A020','#6C5CE7','#2D7A4F','#E84393','#2563EB','#E74C3C','#1ABC9C','#E67E22'];
  const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) || '??';

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="nb-modal">
        <div className="modal-header">
          <div><h3>New Board</h3><p>Create a board for a new client or project</p></div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-group">
            <label className="form-label">Board Name</label>
            <input className="form-input" placeholder="e.g. Bloom Bakery, Personal Brand" value={name} onChange={e=>setName(e.target.value)} autoFocus/>
          </div>
          <div className="form-group">
            <label className="form-label">Color</label>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {COLORS.map(c=>(
                <div key={c} onClick={()=>setColor(c)} style={{
                  width:28,height:28,borderRadius:8,background:c,cursor:'pointer',
                  border:color===c?`3px solid ${c}`:'3px solid transparent',
                  outline:color===c?'2px solid var(--charcoal)':'none',
                  transition:'all .15s'
                }}/>
              ))}
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'var(--cream-dark)',borderRadius:10,marginTop:4}}>
            <div style={{width:36,height:36,borderRadius:9,background:color+'26',color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13}}>{initials}</div>
            <span style={{fontSize:14,fontWeight:500,color:name?'var(--charcoal)':'var(--charcoal-soft)'}}>{name||'Board name preview'}</span>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-amber" onClick={()=>{
            if (!name.trim()) return;
            onAdd({ id: 'board-'+Date.now(), name: name.trim(), color, initials });
            onClose();
          }}>Create Board →</button>
        </div>
      </div>
    </div>
  );
}

// ── Main App ────────────────────────────────────────────────────────────────
function App() {
  const [boards,           setBoards]           = useState(INITIAL_BOARDS);
  const [activeBoard,      setActiveBoard]       = useState('all');
  const [posts,            setPosts]             = useState(SAMPLE_POSTS);
  const [selectedPost,     setSelectedPost]      = useState(null);
  const [clientReviewPost, setClientReviewPost]  = useState(null);
  const [showNewPost,      setShowNewPost]        = useState(false);
  const [showNewBoard,     setShowNewBoard]       = useState(false);

  const boardFor = id => boards.find(b=>b.id===id) || boards[0];
  const filtered = activeBoard==='all' ? posts : posts.filter(p=>p.boardId===activeBoard);
  const pending  = posts.filter(p=>p.status==='needs-edits'||p.status==='pending').length;
  const approved = posts.filter(p=>p.status==='approved').length;
  const inReview = posts.filter(p=>p.status==='in-review').length;
  const sorted   = [...filtered].sort((a,b)=>(STATUS_ORDER[a.status]??9)-(STATUS_ORDER[b.status]??9));

  if (clientReviewPost) {
    return <ClientReview post={clientReviewPost} board={boardFor(clientReviewPost.boardId)} onClose={()=>setClientReviewPost(null)}/>;
  }

  return (
    <div className="app">
      {/* ── SIDEBAR ── */}
      <div className="sidebar">
        <div className="sidebar-logo-wrap">
          <ProofLogo size={26}/>
          <div className="sidebar-tagline">Content Approval Hub</div>
        </div>

        <div className="sidebar-section">
          <div className="sidebar-section-label">Boards</div>
          <div className={`board-item${activeBoard==='all'?' active':''}`} onClick={()=>setActiveBoard('all')}>
            <div className="board-avatar" style={{background:'rgba(255,255,255,.07)',color:'rgba(255,255,255,.4)',fontSize:15}}>⊞</div>
            All Boards
            {pending>0 && <span className="badge">{pending}</span>}
          </div>
          {boards.map(board=>{
            const bp = posts.filter(p=>p.boardId===board.id&&(p.status==='needs-edits'||p.status==='pending')).length;
            return (
              <div key={board.id} className={`board-item${activeBoard===board.id?' active':''}`} onClick={()=>setActiveBoard(board.id)}>
                <BoardAvatar board={board}/>
                {board.name}
                {bp>0 && <span className="badge">{bp}</span>}
              </div>
            );
          })}
        </div>

        {/* ← FIXED: now opens New Board modal, not New Post */}
        <button className="sidebar-new-btn" onClick={()=>setShowNewBoard(true)}>
          + New Board
        </button>

        <div className="sidebar-bottom">
          <div className="user-pill">
            <div className="user-avatar">B</div>
            <div>
              <div className="u-name">Ben</div>
              <div className="u-role">{boards.length} active clients</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── MAIN ── */}
      <div className="main">
        <div className="topbar">
          <div className="topbar-left">
            <h2>{activeBoard==='all'?'All Boards':boardFor(activeBoard).name}</h2>
            <p>{sorted.length} post{sorted.length!==1?'s':''} · {pending} need attention</p>
          </div>
          <div className="topbar-right">
            <button className="btn btn-ghost btn-sm" onClick={()=>setClientReviewPost(posts[0])}>
              Preview Client View →
            </button>
            <button className="btn btn-amber" onClick={()=>setShowNewPost(true)}>+ New Post</button>
          </div>
        </div>

        <div className="stats-bar">
          <div className="stat-box amber"><div className="stat-num">{pending}</div><div className="stat-label">Need Attention</div></div>
          <div className="stat-box"><div className="stat-num">{inReview}</div><div className="stat-label">In Review</div></div>
          <div className="stat-box green"><div className="stat-num">{approved}</div><div className="stat-label">Approved</div></div>
          <div className="stat-box"><div className="stat-num">{posts.length}</div><div className="stat-label">Total Posts</div></div>
        </div>

        <div className="content">
          <div className="posts-grid">
            {sorted.length===0 && (
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <h3>No posts yet</h3>
                <p>Hit "+ New Post" to get started.</p>
              </div>
            )}
            {sorted.map(post=>{
              const board = boardFor(post.boardId);
              return (
                <div key={post.id} className="post-card" onClick={()=>setSelectedPost(post)}>
                  <div className={`post-card-accent ${post.status}`}/>
                  <div className="post-card-body">
                    {post.image
                      ? <img src={post.image} alt="" className="post-thumb" onError={e=>{e.target.style.display='none'}}/>
                      : <div className="post-thumb-icon">{PLATFORMS[post.platform]}</div>
                    }
                    <div className="post-info">
                      <div className="post-title">{post.title}</div>
                      <div className="post-meta">
                        <span style={{color:board.color,fontWeight:600}}>{board.name}</span>
                        {' · '}Due {post.dueDate}
                        {post.thread.length>0 && ` · ${post.thread.length} msg${post.thread.length>1?'s':''}`}
                      </div>
                      <div className="post-preview">{post.content}</div>
                    </div>
                    <div className="post-card-actions" onClick={e=>e.stopPropagation()}>
                      <StatusPill status={post.status}/>
                      {post.status==='needs-edits' && <span className="notif-dot"/>}
                      <button className="btn btn-ghost btn-sm" onClick={e=>{e.stopPropagation();setSelectedPost(post);}}>Open</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* ── MODALS ── */}
      {selectedPost && (
        <PostModal
          post={selectedPost}
          board={boardFor(selectedPost.boardId)}
          onClose={()=>setSelectedPost(null)}
          onClientReview={()=>{setSelectedPost(null);setClientReviewPost(selectedPost);}}
        />
      )}
      {showNewPost && (
        <NewPostModal
          boards={boards}
          onClose={()=>setShowNewPost(false)}
          onAdd={p=>{setPosts(prev=>[p,...prev]);setShowNewPost(false);}}
        />
      )}
      {showNewBoard && (
        <NewBoardModal
          onClose={()=>setShowNewBoard(false)}
          onAdd={b=>{setBoards(prev=>[...prev,b]);setShowNewBoard(false);}}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
